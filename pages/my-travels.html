<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Viajes - OlmedoRides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo">O</div><span class="sidebar-title">OlmedoRides</span></div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">Principal</div>
                    <a href="my-travels.html" class="nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>Mis Viajes</a>
                    <a href="my-bookings.html" class="nav-item" id="myBookingsNav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>Mis Reservas</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">Disponibles</div>
                    <a href="available-travels.html" class="nav-item" id="availableNav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Buscar Viajes</a>
                </div>
            </nav>
            <div class="sidebar-footer"><a href="#" class="nav-item" id="logoutBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Cerrar Sesión</a></div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><button class="menu-toggle" id="menuToggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button><h1 class="page-title" id="pageTitle">Mis Viajes</h1></div>
                <div class="topbar-right"><div class="user-menu"><button class="user-btn" id="userBtn"><div class="user-avatar" id="userAvatar">U</div><div><div class="user-name" id="userName">Usuario</div><div class="user-role" id="userRole">Rol</div></div></button><div class="dropdown" id="userDropdown"><a href="profile.html" class="dropdown-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Mi Perfil</a><div class="dropdown-divider"></div><a href="#" class="dropdown-item" id="logoutDropdown"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Cerrar Sesión</a></div></div></div>
            </header>

            <div class="page-content">
                <div class="stats-grid" id="driverStats" style="display:none; margin-bottom:1.5rem;">
                    <div class="stat-card">
                        <div class="stat-icon primary">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                        </div>
                        <div class="stat-content">
                            <div class="stat-value" id="driverTotalTrips">0</div>
                            <div class="stat-label">Viajes asignados</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </div>
                        <div class="stat-content">
                            <div class="stat-value" id="driverCompletedTrips">0</div>
                            <div class="stat-label">Viajes completados</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        </div>
                        <div class="stat-content">
                            <div class="stat-value" id="driverInProgress">0</div>
                            <div class="stat-label">En curso</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon info">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        </div>
                        <div class="stat-content">
                            <div class="stat-value" id="driverPassengers">0</div>
                            <div class="stat-label">Pasajeros</div>
                        </div>
                    </div>
                </div>

                <div style="display:flex; gap:.5rem; margin-bottom:1.5rem; flex-wrap:wrap;" id="tabs"></div>

                <div class="card">
                    <div class="card-body" style="padding:0;">
                        <div class="table-container">
                            <table class="table">
                                <thead id="tableHead"></thead>
                                <tbody id="tableBody">
                                    <tr><td colspan="10" class="empty-state" style="padding:3rem;"><div class="loading"></div><p style="margin-top:1rem;">Cargando...</p></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Detail modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal" style="max-width: 820px;">
            <div class="modal-header"><h3 class="modal-title" id="detailTitle">Detalle del viaje</h3><button class="modal-close" data-modal-close>&times;</button></div>
            <div class="modal-body" id="detailBody" style="max-height:72vh; overflow-y:auto;"></div>
        </div>
    </div>

    <script type="module">
        import {
            supabase, getSession, getMyProfile, logout, isStaff, roleLabel,
            formatDate, formatCurrency, formatDuration, travelStatusBadge, travelStatusLabel,
            escapeHtml, showToast, seatCabinHtml, seatLegendHtml, seatPositionLabel,
            DEMO_MODE, seatCode, seatIconHtml
        } from '../js/olmedorides.js';

        let currentProfile = null;
        let currentDriver = null;
        let activeTab = 'available';
        let currentTravel = null;

        async function checkAuth() {
            const session = await getSession();
            if (!session) { window.location.href = 'login.html'; return null; }
            const profile = await getMyProfile();
            if (!profile) { window.location.href = 'login.html'; return null; }
            if (isStaff(profile.role)) { window.location.href = 'dashboard.html'; return null; }
            let driver = null;
            if (profile.role === 'driver') {
                const { data } = await supabase.from('drivers').select('*').eq('id', profile.id).maybeSingle();
                driver = data;
                if (!driver) {
                    const { data: created } = await supabase.from('drivers').insert({
                        id: profile.id,
                        license_number: 'PENDIENTE-' + profile.id.slice(0, 8),
                        is_available: true
                    }).select().single();
                    driver = created;
                }
            }
            return { session, profile, driver };
        }

        async function init() {
            const auth = await checkAuth();
            if (!auth) return;
            currentProfile = auth.profile;
            currentDriver = auth.driver;

            document.getElementById('userName').textContent = currentProfile.full_name || 'Usuario';
            document.getElementById('userRole').textContent = roleLabel(currentProfile.role);
            document.getElementById('userAvatar').textContent = (currentProfile.full_name || 'U')[0].toUpperCase();

            if (currentProfile.role === 'driver') {
                document.getElementById('pageTitle').textContent = 'Mis Viajes';
                document.getElementById('myBookingsNav').style.display = 'none';
                document.getElementById('availableNav').style.display = 'none';
                document.getElementById('driverStats').style.display = 'grid';
                activeTab = 'available';
            } else {
                document.getElementById('pageTitle').textContent = 'Mis Viajes';
                activeTab = '';
            }

            renderTabs();
            setupEventListeners();
            await loadData();
            if (currentProfile.role === 'driver') {
                await loadDriverStats();
            }
        }

        function renderTabs() {
            const tabs = document.getElementById('tabs');
            if (currentProfile.role === 'driver') {
                tabs.innerHTML = `
                    <button class="btn btn-secondary tab-btn active" data-tab="available">Viajes disponibles</button>
                    <button class="btn btn-outline tab-btn" data-tab="assigned">Mis viajes activos</button>
                    <button class="btn btn-outline tab-btn" data-tab="history">Historial</button>`;
            } else {
                tabs.innerHTML = `
                    <button class="btn btn-secondary tab-btn active" data-tab="">Todas mis reservas</button>
                    <button class="btn btn-outline tab-btn" data-tab="confirmed">Confirmadas</button>
                    <button class="btn btn-outline tab-btn" data-tab="cancelled">Canceladas</button>`;
            }

            tabs.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    tabs.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('active', 'btn-secondary');
                        b.classList.add('btn-outline');
                    });
                    btn.classList.add('active', 'btn-secondary');
                    btn.classList.remove('btn-outline');
                    activeTab = btn.dataset.tab;
                    loadData();
                });
            });
        }

        function setupEventListeners() {
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('logoutDropdown').addEventListener('click', logout);
            document.getElementById('userBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('userDropdown').classList.toggle('show');
            });
            document.getElementById('tableBody').addEventListener('click', (e) => {
                const claimBtn = e.target.closest('.claim-btn');
                const viewBtn = e.target.closest('.view-btn');
                const cancelBtn = e.target.closest('.cancel-btn');
                const startBtn = e.target.closest('.start-btn');
                const finishBtn = e.target.closest('.finish-btn');
                if (claimBtn) claimTravel(claimBtn.dataset.id, claimBtn);
                if (viewBtn) openDetail(viewBtn.dataset.id);
                if (cancelBtn) cancelBooking(cancelBtn.dataset.bookingId);
                if (startBtn) startTravel(startBtn.dataset.id, startBtn);
                if (finishBtn) finishTravel(finishBtn.dataset.id, finishBtn);
            });
        }

        async function loadData() {
            if (currentProfile.role === 'driver') {
                if (activeTab === 'assigned') await loadAssignedTravels('active');
                else if (activeTab === 'history') await loadAssignedTravels('history');
                else await loadAvailableTravels();
                await loadDriverStats();
            } else {
                await loadBookings(activeTab);
            }
        }

        function setHead(columns) {
            document.getElementById('tableHead').innerHTML = `<tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr>`;
        }

        function emptyRow(colspan, title, text = '') {
            return `<tr><td colspan="${colspan}" class="empty-state" style="padding:3rem;">
                <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg></div>
                <div class="empty-title">${title}</div>
                ${text ? `<p style="font-size:.875rem;">${text}</p>` : ''}
            </td></tr>`;
        }

        async function loadAvailableTravels() {
            setHead(['Código', 'Viaje', 'Ruta', 'Salida', 'Tiempo', 'Vehículo', 'Asientos', 'Acciones']);
            const body = document.getElementById('tableBody');
            body.innerHTML = '<tr><td colspan="8" class="empty-state" style="padding:3rem;"><div class="loading"></div></td></tr>';

            const { data, error } = await supabase.from('travels').select(`
                *, car:cars(brand, model, license_plate, image_url), seats(status, seat_number, seat_position)
            `)
                .is('driver_id', null)
                .eq('status', 'scheduled')
                .gte('departure_time', new Date().toISOString())
                .order('departure_time', { ascending: true });

            if (error) { body.innerHTML = `<tr><td colspan="8" class="alert alert-error">${escapeHtml(error.message)}</td></tr>`; return; }

            if (!data?.length) {
                body.innerHTML = emptyRow(8, 'No hay viajes disponibles', 'La secretaría todavía no ha publicado viajes sin conductor.');
                return;
            }

            body.innerHTML = data.map(t => {
                const seats = t.seats || [];
                const total = seats.length || 4;
                const free = seats.filter(s => s.status === 'available').length;
                return `
                    <tr>
                        <td><span class="travel-code">${escapeHtml(t.travel_code || '—')}</span></td>
                        <td><strong>${escapeHtml(t.title || 'Sin título')}</strong></td>
                        <td style="max-width:220px;">${escapeHtml(t.route || `${t.source_city} → ${t.destination_city}`)}</td>
                        <td>${formatDate(t.departure_time)}</td>
                        <td>${formatDuration(t.average_duration_minutes)}</td>
                        <td>${t.car ? `${escapeHtml(t.car.brand)} ${escapeHtml(t.car.model)}` : '<span style="color:var(--text-light);">Sin asignar</span>'}</td>
                        <td>${free}/${total} libres</td>
                        <td>
                            <button class="btn btn-sm btn-primary claim-btn" data-id="${t.id}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                Ser conductor
                            </button>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function loadAssignedTravels(mode = 'active') {
            const isHistory = mode === 'history';
            setHead(['Código', 'Viaje', 'Ruta', 'Salida', 'Estado', 'Pasajeros', 'Acciones']);
            const body = document.getElementById('tableBody');
            body.innerHTML = '<tr><td colspan="7" class="empty-state" style="padding:3rem;"><div class="loading"></div></td></tr>';

            let query = supabase.from('travels').select(`
                *, car:cars(brand, model, license_plate, image_url), seats(*, traveler:profiles(full_name, phone))
            `)
                .eq('driver_id', currentProfile.id)
                .in('status', isHistory ? ['completed', 'cancelled'] : ['scheduled', 'in_progress'])
                .order('departure_time', { ascending: !isHistory });

            const { data, error } = await query;

            if (error) {
                body.innerHTML = `<tr><td colspan="7" class="alert alert-error">${escapeHtml(error.message)}</td></tr>`;
                return;
            }

            if (!data?.length) {
                body.innerHTML = isHistory
                    ? emptyRow(7, 'Todavía no tienes viajes en el historial', 'Los viajes completados o cancelados aparecerán aquí.')
                    : emptyRow(7, 'No tienes viajes activos', 'Ve a "Viajes disponibles" y toma uno para empezar.');
                return;
            }

            body.innerHTML = data.map(t => {
                const seats = t.seats || [];
                const passengers = seats.filter(s => s.traveler_id);
                const status = travelStatusLabel(t.status);

                let action = '';
                if (t.status === 'scheduled') {
                    action = `<button class="btn btn-sm btn-primary start-btn" data-id="${t.id}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Empezar viaje
                    </button>`;
                } else if (t.status === 'in_progress') {
                    action = `<button class="btn btn-sm btn-danger finish-btn" data-id="${t.id}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
                        Terminar viaje
                    </button>`;
                }

                const started = t.started_at
                    ? `<br><small style="color:var(--text-light);">Inicio: ${formatDate(t.started_at)}</small>`
                    : '';
                const finished = t.finished_at
                    ? `<br><small style="color:var(--text-light);">Fin: ${formatDate(t.finished_at)}</small>`
                    : '';

                return `
                    <tr>
                        <td><span class="travel-code">${escapeHtml(t.travel_code || '—')}</span></td>
                        <td><strong>${escapeHtml(t.title || 'Sin título')}</strong></td>
                        <td style="max-width:220px;">${escapeHtml(t.route || `${t.source_city} → ${t.destination_city}`)}</td>
                        <td>${formatDate(t.departure_time)}</td>
                        <td><span class="badge badge-${travelStatusBadge(t.status)}">${status}</span>${started}${finished}</td>
                        <td>${passengers.length}/${seats.length || 4}</td>
                        <td>
                            <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
                                ${action}
                                <button class="btn btn-sm btn-outline view-btn" data-id="${t.id}">Ver detalle</button>
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function loadDriverStats() {
            if (currentProfile?.role !== 'driver') return;

            const { data, error } = await supabase
                .from('travels')
                .select('id, status, seats(traveler_id)')
                .eq('driver_id', currentProfile.id);

            if (error) {
                console.error('Error cargando estadísticas:', error);
                return;
            }

            const travels = data || [];
            const completed = travels.filter(t => t.status === 'completed').length;
            const inProgress = travels.filter(t => t.status === 'in_progress').length;
            const passengers = travels.reduce((total, t) => {
                return total + (t.seats || []).filter(seat => seat.traveler_id).length;
            }, 0);

            document.getElementById('driverTotalTrips').textContent = travels.length;
            document.getElementById('driverCompletedTrips').textContent = completed;
            document.getElementById('driverInProgress').textContent = inProgress;
            document.getElementById('driverPassengers').textContent = passengers;
        }

        async function loadBookings(status) {
            setHead(['Código', 'Viaje', 'Ruta', 'Fecha', 'Asiento', 'Equipaje', 'Precio', 'Estado', 'Acciones']);
            const body = document.getElementById('tableBody');
            body.innerHTML = '<tr><td colspan="9" class="empty-state" style="padding:3rem;"><div class="loading"></div></td></tr>';

            let query = supabase.from('bookings').select(`
                *, travel:travels(*, car:cars(brand, model, license_plate, image_url), driver:drivers(id, photo_url, profiles(full_name, phone, avatar_url))),
                seat:seats(*)
            `).eq('traveler_id', currentProfile.id).order('created_at', { ascending: false });

            if (status) query = query.eq('status', status);

            const { data, error } = await query;
            if (error) { body.innerHTML = `<tr><td colspan="9" class="alert alert-error">${escapeHtml(error.message)}</td></tr>`; return; }

            if (!data?.length) {
                body.innerHTML = emptyRow(9, 'No tienes reservas', status ? 'No hay reservas con este estado.' : 'Busca un viaje con asiento libre para reservar.');
                return;
            }

            body.innerHTML = data.map(b => {
                const t = b.travel;
                const canCancel = b.status === 'confirmed' && t.status === 'scheduled' && new Date(t.departure_time) > new Date();
                const luggage = b.luggage_confirmed ? `${Number(b.estimated_weight_kg || 0)} kg` : 'Sin equipaje';
                return `
                    <tr>
                        <td><span class="travel-code">${escapeHtml(t.travel_code || '—')}</span></td>
                        <td><strong>${escapeHtml(t.title || 'Sin título')}</strong></td>
                        <td>${escapeHtml(t.source_city)} → ${escapeHtml(t.destination_city)}</td>
                        <td>${formatDate(t.departure_time)}</td>
                        <td>${seatIconHtml(b.seat)}</td>
                        <td>${escapeHtml(luggage)}</td>
                        <td>${formatCurrency(b.total_price)}</td>
                        <td><span class="badge badge-${b.status === 'confirmed' ? 'success' : b.status === 'cancelled' ? 'danger' : 'info'}">${b.status === 'confirmed' ? 'Confirmada' : b.status === 'cancelled' ? 'Cancelada' : b.status}</span></td>
                        <td>
                            <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
                                <button class="btn btn-sm btn-outline view-btn" data-id="${t.id}">Ver</button>
                                ${canCancel ? `<button class="btn btn-sm btn-danger cancel-btn" data-booking-id="${b.id}">Cancelar</button>` : ''}
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function claimTravel(travelId, btn) {
            if (!confirm('¿Quieres ser el conductor de este viaje?')) return;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Tomando...';
            try {
                const { data, error } = await supabase.rpc('claim_travel', { p_travel_id: travelId });
                if (error) throw error;
                showToast(`Ahora eres el conductor del viaje <strong>${escapeHtml(data.travel_code)}</strong>`, 'success');
                await loadData();
            } catch (error) {
                showToast(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Ser conductor';
            }
        }

        function getPositionForAction() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    if (DEMO_MODE) {
                        resolve({ lat: -0.1807, lng: -78.4678, demo: true });
                    } else {
                        reject(new Error('Este navegador no soporta geolocalización'));
                    }
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    position => resolve({
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        demo: false
                    }),
                    () => {
                        if (DEMO_MODE) {
                            resolve({ lat: -0.1807, lng: -78.4678, demo: true });
                        } else {
                            reject(new Error('No se pudo obtener tu ubicación. Activa el permiso de ubicación.'));
                        }
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        async function startTravel(travelId, btn) {
            if (!confirm('¿Iniciar el viaje? Se capturará tu ubicación y la hora de inicio.')) return;

            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Ubicando...';

            try {
                const position = await getPositionForAction();
                if (position.demo) {
                    showToast('Ubicación demo usada: Quito (el navegador no permitió la ubicación real).', 'warning', 6000);
                }

                const { data, error } = await supabase.rpc('start_travel', {
                    p_travel_id: travelId,
                    p_lat: position.lat,
                    p_lng: position.lng
                });
                if (error) throw error;

                showToast(`Viaje iniciado a las <strong>${formatDate(data.started_at)}</strong>`, 'success');
                await loadData();
            } catch (error) {
                showToast(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = original;
            }
        }

        async function finishTravel(travelId, btn) {
            if (!confirm('¿Terminar el viaje? Se capturará tu ubicación y la hora de fin.')) return;

            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Ubicando...';

            try {
                const position = await getPositionForAction();
                if (position.demo) {
                    showToast('Ubicación demo usada: Quito (el navegador no permitió la ubicación real).', 'warning', 6000);
                }

                const { data, error } = await supabase.rpc('finish_travel', {
                    p_travel_id: travelId,
                    p_lat: position.lat,
                    p_lng: position.lng
                });
                if (error) throw error;

                showToast(`Viaje terminado a las <strong>${formatDate(data.finished_at)}</strong>`, 'success');
                await loadData();
            } catch (error) {
                showToast(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = original;
            }
        }

        function mapLink(lat, lng) {
            return `https://www.google.com/maps?q=${lat},${lng}`;
        }

        function pickupSummary(booking) {
            if (!booking) return '—';
            const label = booking.pickup_option === 'other' ? 'Otra ubicación' : 'Ubicación actual';
            const address = booking.pickup_address
                ? `<br><small style="color:var(--text-light);">${escapeHtml(booking.pickup_address)}</small>`
                : '';
            const link = booking.pickup_lat != null && booking.pickup_lng != null
                ? `<br><a href="${mapLink(booking.pickup_lat, booking.pickup_lng)}" target="_blank" rel="noopener">Ver mapa</a>`
                : '';
            return `<strong>${label}</strong>${address}${link}`;
        }

        async function openDetail(travelId) {
            const modal = document.getElementById('detailModal');
            const body = document.getElementById('detailBody');
            modal.classList.add('show');
            body.innerHTML = '<div class="loading" style="display:block;margin:2rem auto;"></div>';

            try {
                const { data: t, error } = await supabase.from('travels').select(`
                    *, car:cars(*), driver:drivers(id, photo_url, profiles(full_name, email, phone, avatar_url)),
                    seats(*, traveler:profiles(full_name, email, phone))
                `).eq('id', travelId).single();
                if (error) throw error;

                const { data: travelBookings } = await supabase
                    .from('bookings')
                    .select('*')
                    .eq('travel_id', travelId)
                    .neq('status', 'cancelled');
                const bookingsBySeat = new Map((travelBookings || []).map(b => [b.seat_id, b]));
                currentTravel = t;

                const seats = (t.seats || []).sort((a, b) => a.seat_number - b.seat_number);
                const avatar = t.driver?.photo_url || t.driver?.profiles?.avatar_url || '';
                const vehicleImage = t.car?.image_url || '';
                const passengers = seats.filter(s => s.traveler_id);
                const myBooking = passengerBookingForMe(seats);
                const myBookingRecord = myBooking ? bookingsBySeat.get(myBooking.id) : null;

                document.getElementById('detailTitle').textContent = t.travel_code || 'Detalle del viaje';

                body.innerHTML = `
                    <div style="display:grid; gap:1.25rem;">
                        <div>
                            <h2 style="margin-bottom:.25rem;">${escapeHtml(t.title || `${t.source_city} → ${t.destination_city}`)}</h2>
                            <div class="travel-meta">
                                <span>${escapeHtml(t.source_city)} → ${escapeHtml(t.destination_city)}</span>
                                <span>${formatDate(t.departure_time)}</span>
                                <span>${formatDuration(t.average_duration_minutes)}</span>
                                <span class="badge badge-${travelStatusBadge(t.status)}">${travelStatusLabel(t.status)}</span>
                            </div>
                        </div>
                        <div class="info-grid">
                            <div class="info-tile"><span class="info-label">Ruta</span><span class="info-value">${escapeHtml(t.route || '—')}</span></div>
                            <div class="info-tile"><span class="info-label">Llegada estimada</span><span class="info-value">${formatDate(t.arrival_time)}</span></div>
                            <div class="info-tile"><span class="info-label">Precio</span><span class="info-value">${formatCurrency(t.price_per_seat)}</span></div>
                            <div class="info-tile"><span class="info-label">Vehículo</span><span class="info-value">${t.car ? `${escapeHtml(t.car.brand)} ${escapeHtml(t.car.model)} (${escapeHtml(t.car.license_plate)})` : 'Sin asignar'}</span></div>
                        </div>
                        ${(t.started_at || t.finished_at) ? `
                        <div class="info-grid">
                            ${t.started_at ? `<div class="info-tile"><span class="info-label">Inicio del viaje</span><span class="info-value">${formatDate(t.started_at)}${t.start_lat != null ? `<br><a href="${mapLink(t.start_lat, t.start_lng)}" target="_blank" rel="noopener">Ver ubicación de inicio</a>` : ''}</span></div>` : ''}
                            ${t.finished_at ? `<div class="info-tile"><span class="info-label">Fin del viaje</span><span class="info-value">${formatDate(t.finished_at)}${t.finish_lat != null ? `<br><a href="${mapLink(t.finish_lat, t.finish_lng)}" target="_blank" rel="noopener">Ver ubicación de fin</a>` : ''}</span></div>` : ''}
                        </div>` : ''}
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                            <div>
                                <div class="label">Conductor</div>
                                ${avatar ? `<img src="${escapeHtml(avatar)}" class="travel-cover" alt="Conductor">` : '<div class="cover-fallback">Sin imagen del conductor</div>'}
                                <p style="margin:.5rem 0 0; font-weight:600;">${escapeHtml(t.driver?.profiles?.full_name || 'Sin asignar')}</p>
                            </div>
                            <div>
                                <div class="label">Vehículo</div>
                                ${vehicleImage ? `<img src="${escapeHtml(vehicleImage)}" class="travel-cover" alt="Vehículo">` : '<div class="cover-fallback">Sin imagen del vehículo</div>'}
                                <p style="margin:.5rem 0 0; font-weight:600;">${t.car ? `${escapeHtml(t.car.brand)} ${escapeHtml(t.car.model)}` : 'Sin asignar'}</p>
                            </div>
                        </div>
                        <div>
                            <div class="label">Mapa de asientos (L acostada)</div>
                            ${seatCabinHtml(seats, { currentProfileId: currentProfile.id })}
                            ${seatLegendHtml()}
                        </div>
                        ${currentProfile.role === 'driver' ? `
                        <div>
                            <div class="label">Pasajeros (${passengers.length})</div>
                            ${passengers.length ? `<div class="table-container"><table class="table">
                                <thead><tr><th>Asiento</th><th>Pasajero</th><th>Equipaje</th><th>Peso</th><th>Precio</th><th>Recogida</th></tr></thead>
                                <tbody>${passengers.map(s => `<tr>
                                    <td>${seatIconHtml(s)}</td>
                                    <td>${escapeHtml(s.traveler?.full_name || 'Pasajero')}<br><small style="color:var(--text-light);">${escapeHtml(s.traveler?.phone || s.traveler?.email || '')}</small></td>
                                    <td>${s.luggage_confirmed ? 'Sí' : 'No'}</td>
                                    <td>${s.luggage_confirmed ? `${Number(s.estimated_weight_kg || 0)} kg` : '—'}</td>
                                    <td>${formatCurrency(s.price)}</td>
                                    <td>${pickupSummary(bookingsBySeat.get(s.id))}</td>
                                </tr>`).join('')}</tbody>
                            </table></div>` : '<p style="font-size:.875rem;color:var(--text-light);">Todavía no hay pasajeros.</p>'}
                        </div>` : ''}
                        ${myBooking ? `
                        <div class="info-tile">
                            <span class="info-label">Tu reserva</span>
                            <span class="info-value" style="display:flex; align-items:center; gap:.5rem; flex-wrap:wrap;">
                                ${seatIconHtml(myBooking, { showPrice: true })}
                                <span>${myBooking.luggage_confirmed ? `Equipaje ${Number(myBooking.estimated_weight_kg || 0)} kg` : 'Sin equipaje'}${myBookingRecord ? `<br>Recogida: ${pickupSummary(myBookingRecord)}` : ''}</span>
                            </span>
                        </div>` : ''}
                        ${t.notes ? `<div class="info-tile"><span class="info-label">Notas</span><span class="info-value">${escapeHtml(t.notes)}</span></div>` : ''}
                    </div>`;
            } catch (error) {
                body.innerHTML = `<div class="alert alert-error">${escapeHtml(error.message)}</div>`;
            }
        }

        function passengerBookingForMe(seats) {
            return seats.find(s => s.traveler_id === currentProfile.id) || null;
        }

        async function cancelBooking(bookingId) {
            if (!confirm('¿Cancelar esta reserva? El asiento volverá a estar disponible.')) return;
            try {
                const { error } = await supabase.rpc('cancel_booking', { p_booking_id: bookingId });
                if (error) throw error;
                showToast('Reserva cancelada y asiento liberado', 'success');
                await loadData();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        document.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', () => b.closest('.modal-overlay').classList.remove('show')));
        document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); }));
        document.addEventListener('click', () => document.getElementById('userDropdown')?.classList.remove('show'));

        init();
    </script>
</body>
</html>
