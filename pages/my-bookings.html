<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - OlmedoRides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo">O</div><span class="sidebar-title">OlmedoRides</span></div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">Principal</div>
                    <a href="my-travels.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>Mis Viajes</a>
                    <a href="my-bookings.html" class="nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>Mis Reservas</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">Disponibles</div>
                    <a href="available-travels.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Buscar Viajes</a>
                </div>
            </nav>
            <div class="sidebar-footer"><a href="#" class="nav-item" id="logoutBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Cerrar Sesión</a></div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><button class="menu-toggle" id="menuToggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button><h1 class="page-title">Mis Reservas</h1></div>
                <div class="topbar-right"><div class="user-menu"><button class="user-btn" id="userBtn"><div class="user-avatar" id="userAvatar">U</div><div><div class="user-name" id="userName">Usuario</div><div class="user-role" id="userRole">Usuario</div></div></button><div class="dropdown" id="userDropdown"><a href="profile.html" class="dropdown-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Mi Perfil</a><div class="dropdown-divider"></div><a href="#" class="dropdown-item" id="logoutDropdown"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Cerrar Sesión</a></div></div></div>
            </header>

            <div class="page-content">
                <div style="display:flex; gap:.5rem; margin-bottom:1.5rem; flex-wrap:wrap;" id="statusTabs">
                    <button class="btn btn-secondary tab-btn active" data-status="">Todas</button>
                    <button class="btn btn-outline tab-btn" data-status="confirmed">Confirmadas</button>
                    <button class="btn btn-outline tab-btn" data-status="cancelled">Canceladas</button>
                    <button class="btn btn-outline tab-btn" data-status="completed">Completadas</button>
                </div>

                <div class="card">
                    <div class="card-body" style="padding:0;">
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr><th>Código viaje</th><th>Viaje</th><th>Ruta</th><th>Fecha</th><th>Asiento</th><th>Equipaje</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr>
                                </thead>
                                <tbody id="bookingsBody"><tr><td colspan="9" class="empty-state" style="padding:3rem;"><div class="loading"></div><p style="margin-top:1rem;">Cargando...</p></td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal" style="max-width: 720px;">
            <div class="modal-header"><h3 class="modal-title">Detalle de Reserva</h3><button class="modal-close" data-modal-close>&times;</button></div>
            <div class="modal-body" id="detailBody"></div>
        </div>
    </div>

    <script type="module">
        import {
            supabase, getSession, getMyProfile, logout, isStaff, roleLabel,
            formatDate, formatCurrency, formatDuration, escapeHtml, showToast,
            seatCabinHtml, seatLegendHtml, seatPositionLabel, travelStatusLabel, seatIconHtml
        } from '../js/olmedorides.js';

        let currentProfile = null;

        async function checkAuth() {
            const session = await getSession();
            if (!session) { window.location.href = 'login.html'; return null; }
            const profile = await getMyProfile();
            if (!profile) { window.location.href = 'login.html'; return null; }
            if (isStaff(profile.role)) { window.location.href = 'dashboard.html'; return null; }
            if (profile.role === 'driver') { window.location.href = 'my-travels.html'; return null; }
            return { session, profile };
        }

        async function init() {
            const auth = await checkAuth();
            if (!auth) return;
            currentProfile = auth.profile;
            document.getElementById('userName').textContent = currentProfile.full_name || 'Usuario';
            document.getElementById('userRole').textContent = roleLabel(currentProfile.role);
            document.getElementById('userAvatar').textContent = (currentProfile.full_name || 'U')[0].toUpperCase();
            setupTabs();
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('logoutDropdown').addEventListener('click', logout);
            document.getElementById('userBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('userDropdown').classList.toggle('show');
            });
            await loadBookings('');
        }

        function setupTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('active', 'btn-secondary');
                        b.classList.add('btn-outline');
                    });
                    btn.classList.add('active', 'btn-secondary');
                    btn.classList.remove('btn-outline');
                    loadBookings(btn.dataset.status);
                });
            });
        }

        async function loadBookings(status) {
            const body = document.getElementById('bookingsBody');
            body.innerHTML = '<tr><td colspan="9" class="empty-state" style="padding:3rem;"><div class="loading"></div></td></tr>';

            let query = supabase.from('bookings').select(`
                *, travel:travels(*, car:cars(*), driver:drivers(id, photo_url, profiles(full_name, phone, avatar_url))),
                seat:seats(*)
            `).eq('traveler_id', currentProfile.id).order('created_at', { ascending: false });

            if (status) query = query.eq('status', status);

            const { data, error } = await query;
            if (error) { body.innerHTML = `<tr><td colspan="9" class="alert alert-error">${escapeHtml(error.message)}</td></tr>`; return; }

            if (!data?.length) {
                body.innerHTML = `<tr><td colspan="9" class="empty-state" style="padding:3rem;">
                    <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg></div>
                    <div class="empty-title">No hay reservas</div>
                    <p style="font-size:.875rem;">Tus reservas aparecerán aquí.</p>
                </td></tr>`;
                return;
            }

            body.innerHTML = data.map(b => {
                const t = b.travel;
                const canCancel = t.status === 'scheduled' && new Date(t.departure_time) > new Date() && b.status === 'confirmed';
                return `
                    <tr>
                        <td><span class="travel-code">${escapeHtml(t.travel_code || '—')}</span></td>
                        <td><strong>${escapeHtml(t.title || 'Sin título')}</strong><br><small style="color:var(--text-light);">${escapeHtml(b.booking_reference)}</small></td>
                        <td>${escapeHtml(t.source_city)} → ${escapeHtml(t.destination_city)}</td>
                        <td>${formatDate(t.departure_time)}</td>
                        <td>${seatIconHtml(b.seat)}</td>
                        <td>${b.luggage_confirmed ? `Sí · ${Number(b.estimated_weight_kg || 0)} kg` : 'No'}</td>
                        <td>${formatCurrency(b.total_price)}</td>
                        <td><span class="badge badge-${b.status === 'confirmed' ? 'success' : b.status === 'cancelled' ? 'danger' : 'info'}">${b.status === 'confirmed' ? 'Confirmada' : b.status === 'cancelled' ? 'Cancelada' : b.status}</span></td>
                        <td>
                            <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
                                <button class="btn btn-sm btn-outline view-btn" data-id="${b.id}">Ver</button>
                                ${canCancel ? `<button class="btn btn-sm btn-danger cancel-btn" data-id="${b.id}">Cancelar</button>` : ''}
                            </div>
                        </td>
                    </tr>`;
            }).join('');

            body.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', () => openDetail(btn.dataset.id)));
            body.querySelectorAll('.cancel-btn').forEach(btn => btn.addEventListener('click', () => cancelBooking(btn.dataset.id)));
        }

        async function openDetail(bookingId) {
            const modal = document.getElementById('detailModal');
            const body = document.getElementById('detailBody');
            modal.classList.add('show');
            body.innerHTML = '<div class="loading" style="display:block;margin:2rem auto;"></div>';

            try {
                const { data: b, error } = await supabase.from('bookings').select(`
                    *, travel:travels(*, car:cars(*), driver:drivers(id, photo_url, profiles(full_name, phone, email, avatar_url)), seats(*)),
                    seat:seats(*)
                `).eq('id', bookingId).single();
                if (error) throw error;

                const t = b.travel;
                const seats = (t.seats || []).sort((a, c) => a.seat_number - c.seat_number);
                const avatar = t.driver?.photo_url || t.driver?.profiles?.avatar_url || '';
                const vehicleImage = t.car?.image_url || '';

                body.innerHTML = `
                    <div style="display:grid; gap:1.25rem;">
                        <div style="display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; align-items:center;">
                            <span class="travel-code">${escapeHtml(t.travel_code)}</span>
                            <span class="badge badge-${b.status === 'confirmed' ? 'success' : b.status === 'cancelled' ? 'danger' : 'info'}">${b.status === 'confirmed' ? 'Confirmada' : b.status === 'cancelled' ? 'Cancelada' : b.status}</span>
                        </div>
                        <div>
                            <h2 style="margin-bottom:.25rem;">${escapeHtml(t.title || `${t.source_city} → ${t.destination_city}`)}</h2>
                            <div class="travel-meta">
                                <span>${escapeHtml(t.source_city)} → ${escapeHtml(t.destination_city)}</span>
                                <span>${formatDate(t.departure_time)}</span>
                                <span>${formatDuration(t.average_duration_minutes)}</span>
                            </div>
                        </div>
                        <div class="info-grid">
                            <div class="info-tile"><span class="info-label">Referencia</span><span class="info-value">${escapeHtml(b.booking_reference)}</span></div>
                            <div class="info-tile"><span class="info-label">Asiento</span><span class="info-value">${seatIconHtml(b.seat, { showPrice: true })}</span></div>
                            <div class="info-tile"><span class="info-label">Equipaje</span><span class="info-value">${b.luggage_confirmed ? `Sí · ${Number(b.estimated_weight_kg || 0)} kg` : 'No'}</span></div>
                            <div class="info-tile"><span class="info-label">Precio</span><span class="info-value">${formatCurrency(b.total_price)}</span></div>
                            <div class="info-tile"><span class="info-label">Recogida</span><span class="info-value">${pickupLabel(b)}</span></div>
                            <div class="info-tile"><span class="info-label">Ruta</span><span class="info-value">${escapeHtml(t.route || '—')}</span></div>
                            <div class="info-tile"><span class="info-label">Estado del viaje</span><span class="info-value">${travelStatusLabel(t.status)}</span></div>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                            <div>
                                <div class="label">Conductor</div>
                                ${avatar ? `<img src="${escapeHtml(avatar)}" class="travel-cover" alt="Conductor">` : '<div class="cover-fallback">Sin imagen del conductor</div>'}
                                <p style="margin:.5rem 0 0; font-weight:600;">${escapeHtml(t.driver?.profiles?.full_name || 'Sin asignar')}</p>
                            </div>
                            <div>
                                <div class="label">Vehículo</div>
                                ${vehicleImage ? `<img src="${escapeHtml(vehicleImage)}" class="travel-cover" alt="Vehículo">` : '<div class="cover-fallback">Sin imagen del vehículo</div>'}
                                <p style="margin:.5rem 0 0; font-weight:600;">${t.car ? `${escapeHtml(t.car.brand)} ${escapeHtml(t.car.model)} (${escapeHtml(t.car.license_plate)})` : 'Sin asignar'}</p>
                            </div>
                        </div>
                        <div>
                            <div class="label">Mapa de asientos</div>
                            ${seatCabinHtml(seats, { currentProfileId: currentProfile.id })}
                            ${seatLegendHtml()}
                        </div>
                        ${t.notes ? `<div class="info-tile"><span class="info-label">Notas</span><span class="info-value">${escapeHtml(t.notes)}</span></div>` : ''}
                    </div>`;
            } catch (error) {
                body.innerHTML = `<div class="alert alert-error">${escapeHtml(error.message)}</div>`;
            }
        }

        function pickupLabel(booking) {
            const label = booking.pickup_option === 'other' ? 'Otra ubicación' : 'Ubicación actual';
            const address = booking.pickup_address
                ? `<br><small style="color:var(--text-light);">${escapeHtml(booking.pickup_address)}</small>`
                : '';
            const link = booking.pickup_lat != null && booking.pickup_lng != null
                ? `<br><a href="https://www.google.com/maps?q=${booking.pickup_lat},${booking.pickup_lng}" target="_blank" rel="noopener">Ver mapa</a>`
                : '';
            return `<strong>${label}</strong>${address}${link}`;
        }

        async function cancelBooking(bookingId) {
            if (!confirm('¿Cancelar esta reserva? El asiento volverá a estar disponible.')) return;
            try {
                const { error } = await supabase.rpc('cancel_booking', { p_booking_id: bookingId });
                if (error) throw error;
                showToast('Reserva cancelada y asiento liberado', 'success');
                document.getElementById('detailModal').classList.remove('show');
                await loadBookings(document.querySelector('.tab-btn.active').dataset.status);
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        document.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', () => b.closest('.modal-overlay').classList.remove('show')));
        document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); }));
        document.addEventListener('click', () => document.getElementById('userDropdown')?.classList.remove('show'));

        init();
    </script>
</body>
</html>
