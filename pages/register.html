<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - OlmedoRides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card" style="max-width: 520px;">
            <div class="auth-header">
                <div class="auth-logo">O</div>
                <h1 class="auth-title">Crear Cuenta</h1>
                <p class="auth-subtitle">Elige cómo quieres usar OlmedoRides y entra con Google</p>
            </div>

            <div class="role-cards" role="radiogroup" aria-label="Tipo de cuenta">
                <label class="role-card">
                    <input type="radio" name="role" value="traveler" checked>
                    <span class="role-card-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                    <span class="role-card-title">Usuario / Pasajero</span>
                    <span class="role-card-desc">Busca viajes, elige asiento y confirma tu equipaje.</span>
                </label>
                <label class="role-card">
                    <input type="radio" name="role" value="driver">
                    <span class="role-card-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3 12h7M14 12h7M12 14.5V21"></path></svg>
                    </span>
                    <span class="role-card-title">Conductor</span>
                    <span class="role-card-desc">Ve los viajes publicados y elige uno para conducirlo.</span>
                </label>
            </div>

            <button type="button" class="btn btn-google btn-full btn-lg" id="googleRegisterBtn">
                <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.223 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                </svg>
                Registrarme con Google
            </button>

            <div class="auth-divider">o con correo</div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label class="label" for="fullName">Nombre completo</label>
                    <input type="text" id="fullName" name="fullName" class="input" placeholder="Juan Pérez" required autocomplete="name">
                    <div class="form-error" data-error-for="fullName"></div>
                </div>

                <div class="form-group">
                    <label class="label" for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="input" placeholder="tu@gmail.com" required autocomplete="email">
                    <div class="form-error" data-error-for="email"></div>
                </div>

                <div class="form-group">
                    <label class="label" for="phone">Teléfono</label>
                    <input type="tel" id="phone" name="phone" class="input" placeholder="+34 600 000 000" autocomplete="tel">
                    <div class="form-error" data-error-for="phone"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="label" for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="input" placeholder="Mínimo 6" required autocomplete="new-password" minlength="6">
                        <div class="form-error" data-error-for="password"></div>
                    </div>
                    <div class="form-group">
                        <label class="label" for="confirmPassword">Confirmar</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="input" placeholder="Repite" required autocomplete="new-password">
                        <div class="form-error" data-error-for="confirmPassword"></div>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" class="checkbox" required>
                    <label for="terms" style="font-size: 0.875rem; cursor: pointer;">Acepto los <a href="#" style="color: var(--primary);">Términos y Condiciones</a></label>
                    <div class="form-error" data-error-for="terms"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" id="registerBtn">Crear Cuenta</button>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase, showToast, redirectByRole } from '../js/olmedorides.js';

        const form = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const googleBtn = document.getElementById('googleRegisterBtn');

        function selectedRole() {
            return document.querySelector('input[name="role"]:checked')?.value || 'traveler';
        }

        googleBtn.addEventListener('click', async () => {
            const role = selectedRole();
            localStorage.setItem('pendingRole', role);
            try {
                googleBtn.disabled = true;
                googleBtn.innerHTML = '<span class="loading"></span> Conectando con Google...';
                const redirectTo = new URL('login.html?oauth=1&role=' + role, window.location.href).toString();
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo }
                });
                if (error) throw error;
            } catch (error) {
                showToast(error.message, 'error');
                googleBtn.disabled = false;
                googleBtn.innerHTML = 'Registrarme con Google';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();

            const data = {
                role: selectedRole(),
                fullName: form.fullName.value.trim(),
                email: form.email.value.trim(),
                phone: form.phone.value.trim(),
                password: form.password.value,
                confirmPassword: form.confirmPassword.value,
                terms: form.terms.checked
            };

            let hasError = false;
            if (!data.fullName || data.fullName.length < 2) {
                showError('fullName', 'Indica tu nombre completo');
                hasError = true;
            }
            if (!data.email || !validateEmail(data.email)) {
                showError('email', 'Correo inválido');
                hasError = true;
            }
            if (data.phone && !validatePhone(data.phone)) {
                showError('phone', 'Teléfono inválido');
                hasError = true;
            }
            if (!data.password || data.password.length < 6) {
                showError('password', 'Mínimo 6 caracteres');
                hasError = true;
            }
            if (data.password !== data.confirmPassword) {
                showError('confirmPassword', 'Las contraseñas no coinciden');
                hasError = true;
            }
            if (!data.terms) {
                showError('terms', 'Debes aceptar los términos');
                hasError = true;
            }
            if (hasError) return;

            showLoading(registerBtn, true);

            try {
                const { data: authData, error } = await supabase.auth.signUp({
                    email: data.email,
                    password: data.password,
                    options: {
                        data: {
                            full_name: data.fullName,
                            role: data.role,
                            phone: data.phone
                        }
                    }
                });
                if (error) throw error;

                if (authData.session) {
                    localStorage.setItem('user', JSON.stringify(authData.user));
                    localStorage.setItem('session', JSON.stringify(authData.session));
                    localStorage.setItem('userRole', data.role);
                    showToast('Cuenta creada. ¡Bienvenido!', 'success');
                    setTimeout(() => redirectByRole(data.role), 600);
                } else {
                    showToast('Cuenta creada. Revisa tu correo para confirmar y luego inicia sesión.', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2200);
                }
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                showLoading(registerBtn, false);
            }
        });

        function showError(field, message) {
            const errorEl = form.querySelector(`[data-error-for="${field}"]`);
            const input = form.querySelector(`[name="${field}"]`);
            if (errorEl) { errorEl.textContent = message; errorEl.classList.add('visible'); }
            if (input) input.style.borderColor = 'var(--danger)';
        }

        function clearErrors() {
            form.querySelectorAll('.form-error').forEach(el => el.classList.remove('visible'));
            form.querySelectorAll('.input').forEach(el => el.style.borderColor = '');
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validatePhone(phone) {
            return /^[\+]?[(]?[0-9]{3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6}$/.test(phone);
        }

        function showLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.dataset.txt = btn.innerHTML;
                btn.innerHTML = '<span class="loading"></span> Creando...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.txt || 'Crear Cuenta';
            }
        }
    </script>
</body>
</html>
