<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - OlmedoRides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">O</div>
                <h1 class="auth-title">Recuperar Contraseña</h1>
                <p class="auth-subtitle">Te enviaremos un enlace para restablecerla</p>
            </div>
            
            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label class="label" for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="input" placeholder="tu@email.com" required autocomplete="email">
                    <div class="form-error" data-error-for="email"></div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">Enviar Enlace</button>
            </form>
            
            <div class="auth-footer">
                <p><a href="login.html">Volver al inicio de sesión</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../js/olmedorides.js';
        
        const form = document.getElementById('forgotForm');
        const btn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();
            
            const email = form.email.value.trim();
            
            if (!email) {
                showError('email', 'El correo es obligatorio');
                return;
            }
            if (!validateEmail(email)) {
                showError('email', 'Correo inválido');
                return;
            }
            
            showLoading(btn, true);
            
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/pages/reset-password.html'
                });
                
                if (error) throw error;
                
                showAlert('Se ha enviado un enlace de recuperación a tu correo', 'success');
                form.reset();
                
            } catch (error) {
                showAlert(error.message, 'error');
            } finally {
                showLoading(btn, false);
            }
        });
        
        function showError(field, message) {
            const errorEl = form.querySelector(`[data-error-for="${field}"]`);
            const input = form.querySelector(`[name="${field}"]`);
            if (errorEl) { errorEl.textContent = message; errorEl.classList.add('visible'); }
            if (input) input.style.borderColor = 'var(--danger)';
        }
        
        function clearErrors() {
            form.querySelectorAll('.form-error').forEach(el => el.classList.remove('visible'));
            form.querySelectorAll('.input').forEach(el => el.style.borderColor = '');
        }
        
        function showLoading(btn, loading) {
            if (loading) { btn.disabled = true; btn.dataset.txt = btn.innerHTML; btn.innerHTML = '<span class="loading"></span> Enviando...'; }
            else { btn.disabled = false; btn.innerHTML = btn.dataset.txt || 'Enviar Enlace'; }
        }
        
        function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
        
        function showAlert(message, type) {
            const existing = document.querySelector('.alert');
            if (existing) existing.remove();
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.style.marginBottom = '1rem';
            alert.innerHTML = message;
            form.insertBefore(alert, form.firstChild);
            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
</html>
