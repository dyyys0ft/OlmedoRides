<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - OlmedoRides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">O</div>
                <h1 class="auth-title">Nueva Contraseña</h1>
                <p class="auth-subtitle">Ingresa tu nueva contraseña</p>
            </div>
            
            <form id="resetForm" novalidate>
                <div class="form-group">
                    <label class="label" for="password">Nueva contraseña</label>
                    <input type="password" id="password" name="password" class="input" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6">
                    <div class="form-error" data-error-for="password"></div>
                </div>
                
                <div class="form-group">
                    <label class="label" for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="input" placeholder="Repite la contraseña" required autocomplete="new-password">
                    <div class="form-error" data-error-for="confirmPassword"></div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">Actualizar Contraseña</button>
            </form>
            
            <div class="auth-footer">
                <p><a href="login.html">Volver al inicio de sesión</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../js/olmedorides.js';
        
        const form = document.getElementById('resetForm');
        const btn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();
            
            const password = form.password.value;
            const confirmPassword = form.confirmPassword.value;
            
            let hasError = false;
            if (!password) { showError('password', 'Contraseña obligatoria'); hasError = true; }
            else if (password.length < 6) { showError('password', 'Mínimo 6 caracteres'); hasError = true; }
            if (password !== confirmPassword) { showError('confirmPassword', 'Las contraseñas no coinciden'); hasError = true; }
            if (hasError) return;
            
            showLoading(btn, true);
            
            try {
                const { error } = await supabase.auth.updateUser({ password });
                if (error) throw error;
                
                showAlert('Contraseña actualizada correctamente', 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                
            } catch (error) {
                showAlert(error.message, 'error');
            } finally {
                showLoading(btn, false);
            }
        });
        
        function showError(field, message) {
            const errorEl = form.querySelector(`[data-error-for="${field}"]`);
            const input = form.querySelector(`[name="${field}"]`);
            if (errorEl) { errorEl.textContent = message; errorEl.classList.add('visible'); }
            if (input) input.style.borderColor = 'var(--danger)';
        }
        
        function clearErrors() {
            form.querySelectorAll('.form-error').forEach(el => el.classList.remove('visible'));
            form.querySelectorAll('.input').forEach(el => el.style.borderColor = '');
        }
        
        function showLoading(btn, loading) {
            if (loading) { btn.disabled = true; btn.dataset.txt = btn.innerHTML; btn.innerHTML = '<span class="loading"></span> Actualizando...'; }
            else { btn.disabled = false; btn.innerHTML = btn.dataset.txt || 'Actualizar Contraseña'; }
        }
        
        function showAlert(message, type) {
            const existing = document.querySelector('.alert');
            if (existing) existing.remove();
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.style.marginBottom = '1rem';
            alert.innerHTML = message;
            form.insertBefore(alert, form.firstChild);
            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
</html>
