<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - OlmedoRides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo">O</div><span class="sidebar-title">OlmedoRides</span></div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">Principal</div>
                    <a href="#" class="nav-item active" id="dashboardLink"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Inicio</a>
                </div>
            </nav>
            <div class="sidebar-footer"><a href="#" class="nav-item" id="logoutBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Cerrar Sesión</a></div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><button class="menu-toggle" id="menuToggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button><h1 class="page-title">Mi Perfil</h1></div>
                <div class="topbar-right"><div class="user-menu"><button class="user-btn" id="userBtn"><div class="user-avatar" id="userAvatar">U</div><div><div class="user-name" id="userName">Usuario</div><div class="user-role" id="userRole">Rol</div></div></button><div class="dropdown" id="userDropdown"><a href="profile.html" class="dropdown-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Mi Perfil</a><div class="dropdown-divider"></div><a href="#" class="dropdown-item" id="logoutDropdown"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Cerrar Sesión</a></div></div></div>
            </header>

            <div class="page-content">
                <div class="card" style="max-width: 680px;">
                    <div class="card-header"><h3 style="margin:0;">Información Personal</h3></div>
                    <form id="profileForm" class="card-body">
                        <div style="display:flex; align-items:center; gap:1.5rem; margin-bottom:2rem; padding-bottom:1.5rem; border-bottom:1px solid var(--border);">
                            <div class="user-avatar" id="largeAvatar" style="width:80px; height:80px; font-size:2rem; overflow:hidden;">
                                <img id="largeAvatarImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
                                <span id="largeAvatarLetter">U</span>
                            </div>
                            <div>
                                <h3 id="displayName" style="margin:0 0 .25rem;">Usuario</h3>
                                <p id="displayEmail" style="margin:0; color:var(--text-light);">email@ejemplo.com</p>
                                <span id="displayRole" class="badge badge-primary" style="margin-top:.5rem;">Usuario</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="label">Nombre completo</label>
                            <input type="text" name="full_name" id="full_name" class="input" placeholder="Tu nombre">
                        </div>

                        <div class="form-group">
                            <label class="label">Correo electrónico</label>
                            <input type="email" name="email" id="email" class="input" placeholder="tu@email.com" disabled style="background:var(--light);">
                            <small style="color:var(--text-light);">El correo no se puede cambiar desde aquí.</small>
                        </div>

                        <div class="form-group">
                            <label class="label">Teléfono</label>
                            <input type="tel" name="phone" id="phone" class="input" placeholder="+34 600 000 000">
                        </div>

                        <div class="form-group">
                            <label class="label">Foto de perfil / imagen del conductor (URL)</label>
                            <input type="url" name="avatar_url" id="avatar_url" class="input" placeholder="https://.../mi-foto.jpg">
                            <img id="avatarPreview" class="image-preview" alt="Vista previa" hidden>
                            <small style="color:var(--text-light);">Si eres conductor, esta imagen se mostrará en tus viajes.</small>
                        </div>

                        <hr style="margin:1.5rem 0; border-color:var(--border);">
                        <h4 style="margin-bottom:1rem;">Cambiar Contraseña</h4>

                        <div class="form-group">
                            <label class="label">Contraseña actual</label>
                            <input type="password" name="current_password" id="current_password" class="input" placeholder="••••••••" autocomplete="current-password">
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                            <div class="form-group">
                                <label class="label">Nueva contraseña</label>
                                <input type="password" name="new_password" id="new_password" class="input" placeholder="Mín. 6 caracteres" minlength="6" autocomplete="new-password">
                            </div>
                            <div class="form-group">
                                <label class="label">Confirmar nueva</label>
                                <input type="password" name="confirm_password" id="confirm_password" class="input" placeholder="Repite la contraseña" autocomplete="new-password">
                            </div>
                        </div>

                        <div class="card-footer" style="display:flex; justify-content:flex-end; gap:1rem; margin:1.5rem -1.5rem -1.5rem;">
                            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                            <button type="submit" class="btn btn-primary" id="saveBtn">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import {
            supabase, getSession, getMyProfile, logout, roleLabel,
            escapeHtml, showToast
        } from '../js/olmedorides.js';

        let currentProfile = null;

        async function checkAuth() {
            const session = await getSession();
            if (!session) { window.location.href = 'login.html'; return null; }
            const profile = await getMyProfile();
            if (!profile) { window.location.href = 'login.html'; return null; }
            return { session, profile };
        }

        async function init() {
            const auth = await checkAuth();
            if (!auth) return;
            currentProfile = auth.profile;

            const dashboardLink = document.getElementById('dashboardLink');
            if (currentProfile.role === 'admin' || currentProfile.role === 'secretary') dashboardLink.href = 'dashboard.html';
            else dashboardLink.href = 'my-travels.html';

            document.getElementById('userName').textContent = currentProfile.full_name || 'Usuario';
            document.getElementById('userRole').textContent = roleLabel(currentProfile.role);
            document.getElementById('userAvatar').textContent = (currentProfile.full_name || 'U')[0].toUpperCase();

            document.getElementById('largeAvatarLetter').textContent = (currentProfile.full_name || 'U')[0].toUpperCase();
            document.getElementById('displayName').textContent = currentProfile.full_name || 'Sin nombre';
            document.getElementById('displayEmail').textContent = currentProfile.email;
            document.getElementById('displayRole').textContent = roleLabel(currentProfile.role);
            document.getElementById('displayRole').className = `badge badge-${getRoleBadge(currentProfile.role)}`;

            document.getElementById('full_name').value = currentProfile.full_name || '';
            document.getElementById('email').value = currentProfile.email || '';
            document.getElementById('phone').value = currentProfile.phone || '';
            document.getElementById('avatar_url').value = currentProfile.avatar_url || '';
            updateAvatarPreview();

            document.getElementById('profileForm').addEventListener('submit', saveProfile);
            document.getElementById('cancelBtn').addEventListener('click', resetForm);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('logoutDropdown').addEventListener('click', logout);
            document.getElementById('userBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('userDropdown').classList.toggle('show');
            });
            document.getElementById('avatar_url').addEventListener('input', updateAvatarPreview);
        }

        function updateAvatarPreview() {
            const url = document.getElementById('avatar_url').value.trim();
            const img = document.getElementById('avatarPreview');
            const largeImg = document.getElementById('largeAvatarImg');
            const letter = document.getElementById('largeAvatarLetter');

            if (url) {
                img.src = url;
                img.hidden = false;
                largeImg.src = url;
                largeImg.style.display = 'block';
                letter.style.display = 'none';
            } else {
                img.hidden = true;
                img.removeAttribute('src');
                largeImg.style.display = 'none';
                letter.style.display = 'inline';
            }
        }

        async function saveProfile(e) {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('saveBtn');

            const fullName = form.full_name.value.trim();
            const phone = form.phone.value.trim();
            const avatarUrl = form.avatar_url.value.trim();
            const currentPass = form.current_password.value;
            const newPass = form.new_password.value;
            const confirmPass = form.confirm_password.value;

            let hasError = false;
            clearErrors(form);
            if (!fullName) { showFieldError(form, 'full_name', 'Nombre obligatorio'); hasError = true; }
            if (newPass || currentPass || confirmPass) {
                if (!currentPass) { showFieldError(form, 'current_password', 'Contraseña actual requerida'); hasError = true; }
                if (!newPass) { showFieldError(form, 'new_password', 'Nueva contraseña requerida'); hasError = true; }
                else if (newPass.length < 6) { showFieldError(form, 'new_password', 'Mínimo 6 caracteres'); hasError = true; }
                if (newPass !== confirmPass) { showFieldError(form, 'confirm_password', 'No coinciden'); hasError = true; }
            }
            if (hasError) return;

            showLoading(btn, true);
            try {
                if (newPass) {
                    const { error: signInError } = await supabase.auth.signInWithPassword({ email: currentProfile.email, password: currentPass });
                    if (signInError) throw new Error('La contraseña actual no es correcta');
                }

                const { error: profileError } = await supabase.from('profiles').update({
                    full_name: fullName,
                    phone: phone || null,
                    avatar_url: avatarUrl || null
                }).eq('id', currentProfile.id);
                if (profileError) throw profileError;

                if (currentProfile.role === 'driver') {
                    await supabase.from('drivers').update({ photo_url: avatarUrl || null }).eq('id', currentProfile.id);
                }

                if (newPass) {
                    const { error: passError } = await supabase.auth.updateUser({ password: newPass });
                    if (passError) throw passError;
                }

                currentProfile.full_name = fullName;
                currentProfile.phone = phone;
                currentProfile.avatar_url = avatarUrl;

                document.getElementById('userName').textContent = fullName;
                document.getElementById('displayName').textContent = fullName;
                document.getElementById('largeAvatarLetter').textContent = fullName[0].toUpperCase();
                document.getElementById('userAvatar').textContent = fullName[0].toUpperCase();
                showToast('Perfil actualizado correctamente', 'success');
                resetForm();
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                showLoading(btn, false);
            }
        }

        function resetForm() {
            document.getElementById('current_password').value = '';
            document.getElementById('new_password').value = '';
            document.getElementById('confirm_password').value = '';
            clearErrors(document.getElementById('profileForm'));
        }

        function getRoleBadge(role) {
            return ({ admin: 'danger', secretary: 'warning', driver: 'info', traveler: 'primary' })[role] || 'gray';
        }
        function showLoading(btn, l) {
            if (l) { btn.disabled = true; btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="loading"></span> Guardando...'; }
            else { btn.disabled = false; btn.innerHTML = btn.dataset.t || btn.innerHTML; }
        }
        function clearErrors(f) {
            f.querySelectorAll('.form-error').forEach(e => e.classList.remove('visible'));
            f.querySelectorAll('.input').forEach(e => e.style.borderColor = '');
        }
        function showFieldError(f, field, msg) {
            const el = f.querySelector(`[name="${field}"]`);
            let err = f.querySelector(`[data-error-for="${field}"]`);
            if (!err) { err = document.createElement('div'); err.className = 'form-error'; err.dataset.errorFor = field; el.parentNode.appendChild(err); }
            err.textContent = msg;
            err.classList.add('visible');
            if (el) el.style.borderColor = 'var(--danger)';
        }

        document.addEventListener('click', () => document.getElementById('userDropdown')?.classList.remove('show'));
        init();
    </script>
</body>
</html>
