<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso No Autorizado - OlmedoRides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-page" style="background: linear-gradient(135deg, var(--danger) 0%, #b91c1c 100%);">
        <div class="auth-card" style="max-width: 440px; text-align: center;">
            <div class="auth-logo" style="width: 80px; height: 80px; font-size: 2rem; background: var(--white); color: var(--danger); margin-bottom: 1.5rem;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <h1 class="auth-title" style="color: var(--white);">Acceso No Autorizado</h1>
            <p class="auth-subtitle" style="color: rgba(255,255,255,0.8);">No tienes permisos para acceder a esta página</p>
            
            <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
                <a href="javascript:history.back()" class="btn btn-secondary btn-full btn-lg" style="border-color: var(--white); color: var(--white);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Volver
                </a>
                <a href="login.html" class="btn btn-primary btn-full btn-lg" style="background: var(--white); color: var(--danger); border-color: var(--white);">
                    Iniciar Sesión
                </a>
            </div>
        </div>
    </div>
</body>
</html>
