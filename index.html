<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OlmedoRides - Sistema de Gestión de Viajes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page" style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);">
        <div class="auth-card" style="max-width: 500px; text-align: center;">
            <div class="auth-logo" style="width: 80px; height: 80px; font-size: 2rem; margin-bottom: 1.5rem;">O</div>
            <h1 class="auth-title" style="color: var(--white);">OlmedoRides</h1>
            <p class="auth-subtitle" style="color: rgba(255,255,255,0.8); font-size: 1.125rem;">Entra con Google, elige viaje y reserva tu asiento</p>
            
            <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
                <a href="pages/login.html" class="btn btn-primary btn-full btn-lg" style="background: var(--white); color: var(--primary); border-color: var(--white);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    Iniciar Sesión / Continuar con Google
                </a>
                <a href="pages/register.html" class="btn btn-secondary btn-full btn-lg" style="border-color: var(--white); color: var(--white);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Registrarme como conductor o usuario
                </a>
            </div>
            
            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.2);">
                <p style="color: rgba(255,255,255,0.6); font-size: 0.875rem;">Roles: Administrador, Secretaria, Conductor y Usuario/Pasajero</p>
                <p style="color: rgba(255,255,255,0.45); font-size: 0.8125rem; margin-top: 0.5rem;">Asientos en L: 1 delantero derecho + 3 atrás</p>
            </div>
        </div>
    </div>
</body>
</html>
